name: BluePilot Chestnut source validation

on:
  push:
    branches: [SP-BPDEV]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ford-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SKIP_TINYGRAD_COMPILE: '1'
      UV_PROJECT_ENVIRONMENT: /tmp/bluepilot-venv
      VIRTUAL_ENV: /tmp/bluepilot-venv
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo:${{ github.workspace }}/msgq_repo:${{ github.workspace }}/rednose_repo:${{ github.workspace }}/tinygrad_repo
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify preserved Chestnut source and model artifacts
        run: python3 tools/bluepilot_chestnut/preflight.py
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang build-essential libffi-dev xvfb libgl1-mesa-dri libegl1 libgl1 libgles2
          python3 -m venv "$RUNNER_TEMP/uv-bootstrap"
          "$RUNNER_TEMP/uv-bootstrap/bin/pip" install uv
          export PATH="$RUNNER_TEMP/uv-bootstrap/bin:$PATH"
          uv sync --locked --extra submodules --extra tools
          uv pip install --python "$VIRTUAL_ENV/bin/python" pytest pytest-xdist scipy pillow ruff ruamel.yaml pyyaml jsonschema
          # Same exact analyzer revision as opendbc_repo/uv.lock.
          uv pip install --python "$VIRTUAL_ENV/bin/python" 'cppcheck @ git+https://github.com/commaai/dependencies.git@b7253ddb101ed6add04fc2a2ce0688d5e21a55ee#subdirectory=cppcheck'
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
      - name: Check all safety C sources and verify deliberate Ford violations are rejected
        run: python tools/bluepilot_chestnut/check_safety_misra.py
      - name: Build native consumers and Panda firmware without compiling driving models
        run: scons --minimal -j4
      - name: Test all vehicle safety hooks and Ford control, UI, and integration
        run: |
          python -m pytest -q \
            opendbc_repo/opendbc/safety/tests \
            --ignore=opendbc_repo/opendbc/safety/tests/misra \
            opendbc_repo/opendbc/car/ford/tests \
            opendbc_repo/opendbc/sunnypilot/car/ford/tests \
            opendbc_repo/opendbc/sunnypilot/car/tests/test_car_list.py \
            openpilot/selfdrive/ui/bp/tests \
            openpilot/selfdrive/selfdrived/tests/test_alertmanager.py \
            openpilot/selfdrive/selfdrived/tests/test_alerts.py \
            openpilot/sunnypilot/system/tests/test_params_migration.py \
            openpilot/sunnypilot/sunnylink/tests/test_settings_changes.py \
            openpilot/sunnypilot/sunnylink/tests/test_capabilities.py \
            openpilot/sunnypilot/sunnylink/tests/test_compile_settings_ui.py \
            openpilot/selfdrive/locationd/test/test_lagd.py \
            openpilot/selfdrive/car/tests/test_cruise_speed.py \
            openpilot/system/hardware/tests/test_fan_controller.py \
            tools/bluepilot_chestnut
      - name: Check migrated Python names
        run: python tools/bluepilot_chestnut/check_python.py
      - name: Confirm driving-model artifacts are unchanged after the build
        run: python tools/bluepilot_chestnut/preflight.py --models-only
